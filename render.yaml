services:
  # Backend Service (FastAPI) only
  - type: web
    name: fixilab-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8000
    disk:
      name: uploads
      mountPath: /opt/render/project/backend/uploads
      sizeGB: 1
